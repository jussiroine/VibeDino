<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeDino - Admin Statistics</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-description {
            font-size: 0.9em;
            color: #888;
        }

        .top-scores {
            background: #f8f9fa;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .top-scores h2 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
        }

        .score-list {
            list-style: none;
            padding: 0;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
        }

        .score-rank {
            font-weight: bold;
            color: #4CAF50;
            width: 30px;
        }

        .score-player {
            flex: 1;
            margin: 0 10px;
            font-family: monospace;
        }

        .score-value {
            font-weight: bold;
            color: #333;
        }

        .score-time {
            font-size: 0.8em;
            color: #666;
        }

        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .online-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="stats-container">
        <a href="/" class="back-link">← Back to Game</a>
        
        <h1>🦕 VibeDino Admin Statistics</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Current Players</div>
                <div class="stat-number" id="currentUsers">-</div>
                <div class="stat-description">
                    <span class="online-indicator"></span>Live concurrent players
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Total Sessions</div>
                <div class="stat-number" id="totalSessions">-</div>
                <div class="stat-description">All-time player connections</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Peak Users</div>
                <div class="stat-number" id="peakUsers">-</div>
                <div class="stat-description">Maximum concurrent players</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Top Score</div>
                <div class="stat-number" id="topScore">-</div>
                <div class="stat-description">Highest score achieved</div>
            </div>
        </div>
        
        <div class="top-scores">
            <h2>🏆 Leaderboard - Top 10 Scores</h2>
            <ul class="score-list" id="scoreList">
                <li class="score-item">
                    <span class="score-rank">-</span>
                    <span class="score-player">Loading...</span>
                    <span class="score-value">-</span>
                </li>
            </ul>
        </div>
        
        <div class="last-updated" id="lastUpdated">
            Last updated: -
        </div>
    </div>

    <script>
        let statsInterval;

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}d ${hours % 24}h`;
            if (hours > 0) return `${hours}h ${minutes % 60}m`;
            if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
            return `${seconds}s`;
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                // Update main stats
                document.getElementById('currentUsers').textContent = stats.currentConcurrentUsers;
                document.getElementById('totalSessions').textContent = stats.totalSessions.toLocaleString();
                document.getElementById('peakUsers').textContent = stats.peakConcurrentUsers;
                document.getElementById('topScore').textContent = stats.topScore.toLocaleString();
                
                // Update leaderboard
                const scoreList = document.getElementById('scoreList');
                if (stats.topScores && stats.topScores.length > 0) {
                    scoreList.innerHTML = stats.topScores.map((score, index) => `
                        <li class="score-item">
                            <span class="score-rank">#${index + 1}</span>
                            <span class="score-player">${score.playerId}</span>
                            <span class="score-value">${score.score.toLocaleString()}</span>
                            <span class="score-time">${formatTime(score.timestamp)}</span>
                        </li>
                    `).join('');
                } else {
                    scoreList.innerHTML = '<li class="score-item"><span class="score-player">No scores yet - be the first to play!</span></li>';
                }
                
                // Update timestamp
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${formatTime(stats.timestamp)}`;
                
            } catch (error) {
                console.error('Failed to fetch stats:', error);
                document.getElementById('lastUpdated').textContent = 
                    'Error loading stats - server may be offline';
            }
        }

        // Initial load
        updateStats();
        
        // Update every 5 seconds
        statsInterval = setInterval(updateStats, 5000);
        
        // Clean up interval when page is unloaded
        window.addEventListener('beforeunload', () => {
            clearInterval(statsInterval);
        });
    </script>
</body>
</html>

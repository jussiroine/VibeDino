<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeDino - T-Rex Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>VibeDino - Multiplayer</h1>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p>Press SPACEBAR or TAP/TOUCH the screen to jump over rocks!</p>
            <p>Your Score: <span id="score">0</span></p>
            <p><small>You can see other players' games stacked below yours!</small></p>
            <p><small><a href="/stats.html" target="_blank" style="color: #4CAF50;">📊 View Game Statistics</a></small></p>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
